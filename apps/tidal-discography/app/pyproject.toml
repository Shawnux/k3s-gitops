[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal-discography"
version = "2.3.0"
description = "Keeps TIDAL playlists filled with the real discography of every artist you follow."
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.scripts]
tidal-disco = "tidal_disco.cli:main"

[tool.setuptools]
packages = ["tidal_disco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
