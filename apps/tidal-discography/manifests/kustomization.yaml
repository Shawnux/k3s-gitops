apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tidal-discography
resources:
  - namespace.yaml
  - pvc.yaml
  - cronjob.yaml
  # - sealedsecret.yaml   # add if you seal the secret into git (README, step 3)
configMapGenerator:
  - name: tidal-discography-config
    files:
      - config.toml
generatorOptions:
  disableNameSuffixHash: true
